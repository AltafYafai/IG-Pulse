name: Release

on:
  workflow_dispatch:

jobs:
  release:
    permissions: write-all
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      CHANNEL_ID: ${{ secrets.TG_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's default `packages` is `tools platform-tools`, but the `tools` package
          # was removed from Google's repository, so sdkmanager exits 1. Pin a package that
          # still exists; AGP downloads compileSdk 37 itself once licences are accepted.
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Read version
        id: vars
        run: |
          # versionName is `1.0.0 ($gitHash)` - stop at the first space so the tag is 1.0.0.
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed -n 's/.*versionName = "\([^ ]*\).*/\1/p' | head -n 1)
          SHA8=$(git rev-parse --short=8 HEAD | tr '[:lower:]' '[:upper:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION-$SHA8" >> "$GITHUB_OUTPUT"

      - name: Write signing key
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEY_STORE" ]; then
            echo "androidStorePassword=$KEY_STORE_PASSWORD" >> gradle.properties
            echo "androidKeyAlias=$ALIAS" >> gradle.properties
            echo "androidKeyPassword=$KEY_PASSWORD" >> gradle.properties
            echo "androidStoreFile=key.jks" >> gradle.properties
            echo "$KEY_STORE" | base64 --decode > key.jks
          fi

      - name: chmod +x gradlew
        run: chmod +x gradlew

      - name: Build release
        run: ./gradlew assembleRelease

      # Secrets cannot be read inside a step `if:`, so the emptiness check goes through an
      # output first - otherwise the publish step would either always or never run.
      - name: Check release token
        id: token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: echo "set=$([ -n "$RELEASE_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub
        if: steps.token.outputs.set == 'true'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          # Set the RELEASES_REPO variable to publish somewhere other than this repository.
          repository: ${{ vars.RELEASES_REPO || github.repository }}
          name: IG-Pulse ${{ steps.vars.outputs.version }}
          body_path: CHANGELOG.md
          files: app/build/outputs/apk/release/*.apk
          tag_name: ${{ steps.vars.outputs.tag }}

      # `secrets` cannot be read from a step `if:`, so the emptiness check happens in the
      # script and the step is a no-op when Telegram is not configured.
      - name: Post to Telegram
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHANNEL_ID" ]; then
            echo "TG_BOT_TOKEN / TG_CHAT_ID not set - skipping Telegram notify"
            exit 0
          fi

          esc() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' "$1"; }
          CHANGELOG=$(esc CHANGELOG.md)

          MSG="<b>IG-Pulse ${VERSION} released</b>

          <code>${TAG}</code>

          <a href=\"https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}\">GitHub release</a>

          ${CHANGELOG}"

          curl -fsS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -F chat_id="$CHANNEL_ID" \
            -F parse_mode=HTML \
            -F disable_web_page_preview=true \
            -F text="$MSG" > /dev/null

          shopt -s nullglob
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "Uploading $(basename "$apk") to Telegram"
            curl -fsS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
              -F chat_id="$CHANNEL_ID" \
              -F document=@"$apk" \
              -F caption="IG-Pulse ${VERSION} · $(basename "$apk")" > /dev/null
          done
