name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build IG-Pulse
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml
            **/gradle.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # No fixed `packages` list: ubuntu-latest already ships an SDK, and AGP downloads
          # compileSdk 37 itself once the licences are accepted (this is what WA relies on).
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Write signing key
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEY_STORE" ]; then
            echo "androidStorePassword=$KEY_STORE_PASSWORD" >> gradle.properties
            echo "androidKeyAlias=$ALIAS" >> gradle.properties
            echo "androidKeyPassword=$KEY_PASSWORD" >> gradle.properties
            echo "androidStoreFile=key.jks" >> gradle.properties
            echo "$KEY_STORE" | base64 --decode > key.jks
          fi

      - name: chmod +x gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ig-pulse-apk
          path: app/build/outputs/apk/**/*.apk
