name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build IG-Pulse
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml
            **/gradle.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's default `packages` is `tools platform-tools`, but the `tools` package
          # was removed from Google's repository, so sdkmanager exits 1. Pin a package that
          # still exists; AGP downloads compileSdk 37 itself once licences are accepted.
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Write signing key
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEY_STORE" ]; then
            echo "androidStorePassword=$KEY_STORE_PASSWORD" >> gradle.properties
            echo "androidKeyAlias=$ALIAS" >> gradle.properties
            echo "androidKeyPassword=$KEY_PASSWORD" >> gradle.properties
            echo "androidStoreFile=key.jks" >> gradle.properties
            echo "$KEY_STORE" | base64 --decode > key.jks
          fi

      - name: chmod +x gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: ig-pulse-apk
          path: app/build/outputs/apk/**/*.apk

      # `secrets` cannot be read from a step `if:`, so the emptiness check happens in the
      # script and the step is a no-op when Telegram is not configured.
      - name: Telegram notify
        if: github.event_name == 'push'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "TG_BOT_TOKEN / TG_CHAT_ID not set - skipping Telegram notify"
            exit 0
          fi

          # Secrets are easy to paste with stray whitespace, which Telegram rejects with a 401.
          TG_BOT_TOKEN=$(printf '%s' "$TG_BOT_TOKEN" | tr -d '[:space:]')
          TG_CHAT_ID=$(printf '%s' "$TG_CHAT_ID" | tr -d '[:space:]')

          # Sends a Telegram request and prints the API response, so failures are diagnosable
          # from the job log without exposing the token.
          tg() {
            local method=$1 resp
            shift
            resp=$(curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/${method}" "$@")
            case $resp in
              *'"ok":true'*) echo "${method}: ok" ;;
              *) echo "${method}: ${resp}" >&2; return 1 ;;
            esac
          }

          esc() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          SUBJECT=$(esc "${COMMIT_MESSAGE%%$'\n'*}")

          MSG="<b>Build succeeded: ${REPO}</b>
          branch <code>${REF}</code> · commit <code>${SHA:0:8}</code>
          ${SUBJECT}

          <a href=\"${RUN_URL}\">Workflow run</a>"

          tg sendMessage \
            --form-string chat_id="$TG_CHAT_ID" \
            --form-string parse_mode=HTML \
            --form-string disable_web_page_preview=true \
            --form-string text="$MSG"

          shopt -s nullglob
          for apk in app/build/outputs/apk/*/*.apk; do
            echo "Uploading $(basename "$apk") to Telegram"
            tg sendDocument \
              --form-string chat_id="$TG_CHAT_ID" \
              -F document=@"$apk" \
              --form-string caption="$(basename "$apk")"
          done
